name: Tự động quét tin Tuyển sinh 10

on:
  schedule:
    - cron: '0 * * * *'      # mỗi 1 tiếng chạy 1 lần
  workflow_dispatch:

permissions:
  contents: write            # ⚠️ BẮT BUỘC để git push được

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra kho code
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy con bot quét dữ liệu
        run: python Web_Scrapping.py      # ⚠️ ĐỔI thành tên file .py của bạn

      - name: Tự động cập nhật trang web lên GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html cac_link_da_xem.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Bot tự động cập nhật" && git push)

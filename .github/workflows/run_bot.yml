name: Tự động quét tin Tuyển sinh 10

on:
  schedule:
    # Cứ mỗi 60 phút (1 tiếng) hệ thống sẽ tự động kích hoạt chạy bot 1 lần
    - cron: '0 * * * *'
  workflow_dispatch: # Nút bấm để ông có thể chủ động nhấn chạy tay bất cứ lúc nào

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kiểm tra kho code
      uses: actions/checkout@v3

    - name: Thiết lập môi trường Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt các thư viện cần thiết
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chạy con bot quét dữ liệu
      run: python Web_Scrapping.py

    - name: Tự động cập nhật trang web lên GitHub Pages nếu có thay đổi
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add index.html cac_link_da_xem.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Bot tự động cập nhật trang web" && git push)
